name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Permisos gradlew
        run: chmod +x ./gradlew

      - name: Obtener versión
        id: version
        run: |
          VERSION=$(grep versionName app/build.gradle | head -1 | tr -d ' ' | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Versión: $VERSION"

      - name: Compilar APK release
        run: ./gradlew assembleRelease --stacktrace

      - name: Renombrar APK con versión
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/SurfMalaga-v${{ steps.version.outputs.VERSION }}.apk

      - name: Generar version.json
        run: |
          cat > version.json << JSONEOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "apk_url": "https://github.com/Unkash/Data-Surfing/releases/download/v${{ steps.version.outputs.VERSION }}/SurfMalaga-v${{ steps.version.outputs.VERSION }}.apk",
            "release_url": "https://github.com/Unkash/Data-Surfing/releases/tag/v${{ steps.version.outputs.VERSION }}"
          }
          JSONEOF
          cat version.json

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SurfMalaga-v${{ steps.version.outputs.VERSION }}
          path: app/build/outputs/apk/release/SurfMalaga-v${{ steps.version.outputs.VERSION }}.apk
          retention-days: 30

      - name: Crear Release con APK y version.json
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Surf Málaga v${{ steps.version.outputs.VERSION }}
          files: |
            app/build/outputs/apk/release/SurfMalaga-v${{ steps.version.outputs.VERSION }}.apk
            version.json
          body: |
            ## Surf Málaga v${{ steps.version.outputs.VERSION }}
            Descarga el APK e instálalo en tu Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Actualizar version.json en rama main
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add version.json
          git diff --staged --quiet || git commit -m "chore: update version.json to v${{ steps.version.outputs.VERSION }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
