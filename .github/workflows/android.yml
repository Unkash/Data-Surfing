name: Build and Sign Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # Le asignamos 4GB de RAM a Gradle y optimizamos la recolección de basura
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseParallelGC'"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo
      uses: actions/checkout@v4

    - name: Configurar Java 21 (LTS)
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Compilar APK Release
      run: gradle assembleRelease --no-daemon

    - name: Decodificar archivo Keystore desde Secrets
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.p12

    - name: Firmar APK con apksigner
      run: |
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
        APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
        $BUILD_TOOLS_DIR/apksigner sign --ks release.p12 --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" --ks-key-alias "${{ secrets.KEY_ALIAS }}" --out app-signed.apk $APK_PATH

    - name: Guardar APK Firmado
      uses: actions/upload-artifact@v4
      with:
        name: Data-Surfing-Signed-APK
        path: app-signed.apk
